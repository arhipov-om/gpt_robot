[project]
name = "gpt-robot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.23.0",
    "environs>=14.5.0",
    "langchain>=1.1.3",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.3",
    "redis>=7.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.9",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["RUF001", "RUF002"]
exclude = ["tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
